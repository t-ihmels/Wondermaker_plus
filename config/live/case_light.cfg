# >>> wondermaker+ begin: case-light-control
# GPIO76 is shared with the stock screen. SET_PIN sets the saved preference;
# actual illumination follows screen/print activity. Requires the case-light
# screen bridge from `tools/deploy.py install preload` for screen choices.
[wmp_case_light]

[gcode_macro CASE_LIGHT_ON]
description: Enable the saved case-light preference
gcode:
    SET_PIN PIN=case_light VALUE=1

[gcode_macro CASE_LIGHT_OFF]
description: Disable the saved case-light preference
gcode:
    SET_PIN PIN=case_light VALUE=0

[gcode_macro CASE_LIGHT_TOGGLE]
description: Toggle the saved case-light preference
gcode:
    _WMP_CASE_LIGHT_TOGGLE
# <<< wondermaker+ end: case-light-control
