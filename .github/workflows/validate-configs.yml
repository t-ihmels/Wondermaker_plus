name: Validate Klipper configs

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/utils
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install jinja2 pytest
      - run: python tools/validate_klipper_config.py
      - run: python -m pytest -q tests/test_klipper_config_validation.py
